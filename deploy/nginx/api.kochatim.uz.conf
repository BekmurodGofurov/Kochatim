# api.kochatim.uz — TLS terminator for the backend API.
#
# Runs on the HOST, not in Docker. Docker publishes the backend on
# 127.0.0.1:8000 and nginx is the only thing in front of it.
#
# Install:
#   sudo cp deploy/nginx/api.kochatim.uz.conf \
#           /etc/nginx/sites-available/api.kochatim.uz
#   sudo ln -s /etc/nginx/sites-available/api.kochatim.uz \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.kochatim.uz
#
# certbot rewrites this file in place: it adds the `listen 443 ssl`
# block, the certificate paths, and a redirect from 80. Do not paste
# those by hand — and after certbot has edited it, copy the result back
# into the repo so this file stays the source of truth.
#
# Why the frontend needs this at all: Cloudflare Pages serves the site
# over HTTPS, and an HTTPS page cannot call an http:// API — the
# browser blocks it as mixed content.

server {
    listen 80;
    listen [::]:80;
    server_name api.kochatim.uz;

    # Image uploads go through POST /api/img/upload on their way to
    # ImgBB. nginx defaults to 1m, which rejects most phone photos with
    # a 413 before the request ever reaches Flask.
    client_max_body_size 10m;

    # No add_header Access-Control-* here. Flask already sends the CORS
    # headers from ALLOWED_ORIGINS (backend/app.py); a second set makes
    # the browser see two values and reject the response outright.

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # utils/device.py:get_client_ip reads this first and falls back
        # to remote_addr. Without it every session row records the
        # proxy's address and the city lookup is meaningless.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # GET /api/img/<file_id> streams image bytes proxied from Telegram
    # and is cached for a day by the backend. Buffering a binary body in
    # memory buys nothing here.
    location ~ ^/api/img/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/api.kochatim.uz.access.log;
    error_log  /var/log/nginx/api.kochatim.uz.error.log;
}
