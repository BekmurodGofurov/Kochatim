limit_req_zone $binary_remote_addr zone=kochatim_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=kochatim_auth:10m rate=5r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name api.kochatim.uz;

    # Do not advertise the nginx version.
    server_tokens off;

    # Image uploads go through POST /api/img/upload on their way to
    # ImgBB. nginx defaults to 1m, which rejects most phone photos with
    # a 413 before the request ever reaches Flask.
    client_max_body_size 10m;

    # No add_header Access-Control-* here. Flask already sends the CORS
    # headers from ALLOWED_ORIGINS (backend/app.py); a second set makes
    # the browser see two values and reject the response outright.

    # Login endpoints: the tightest budget. A person types a code a few
    # times; only a script needs more than this.
    location /auth/ {
        limit_req zone=kochatim_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    location / {
        limit_req zone=kochatim_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location ~ ^/api/img/ {
        limit_req zone=kochatim_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/api.kochatim.uz.access.log;
    error_log  /var/log/nginx/api.kochatim.uz.error.log;
}
