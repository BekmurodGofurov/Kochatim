name: CI

on:
  push:
    # Only the integration branch. Feature branches are covered by the
    # pull_request trigger below; running on every push as well would
    # double every run for no extra signal.
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels the run still in flight for that PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # python-version mirrors each service's Dockerfile base image, so
          # CI tests the interpreter the service actually ships on. This is
          # not cosmetic for the bot: aiogram 2.x does not install on 3.12+,
          # and on a newer interpreter 25 of its tests skip themselves
          # rather than fail.
          - suite: backend
            service: backend
            python-version: '3.11'
            testpath: test
            config: test/pytest.ini
          - suite: admin
            service: admin
            python-version: '3.11'
            testpath: admin/tests
            config: admin/pytest.ini
          - suite: bot
            service: bot
            python-version: '3.11'
            testpath: bot/tests
            config: bot/pytest.ini
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            test/requirements-test.txt
            ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        # Test tooling lives in test/requirements-test.txt, never in a
        # service's requirements.txt — those are what the Dockerfiles
        # install, and production images should not ship a test runner.
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service }}/requirements.txt \
                      -r test/requirements-test.txt

      - name: Verify aiogram imports
        # bot/tests/test_throttling.py skips its whole file when aiogram
        # is missing, and a skip is not a pass — that is exactly how two
        # of those tests once stayed green for the wrong reason. Assert
        # the import here so a bad interpreter fails the job loudly
        # instead of quietly running 123 tests instead of 148.
        if: matrix.suite == 'bot'
        run: python -c "import aiogram; print('aiogram', aiogram.__version__)"

      - name: Run tests
        # No env vars are set on purpose. Each conftest.py seeds the
        # environment it needs at module level, before importing the
        # service, so the suites are hermetic. If one ever starts needing
        # ambient config, this job should be the thing that tells us.
        run: python -m pytest ${{ matrix.testpath }} -c ${{ matrix.config }}

  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches client/Dockerfile's node:20-alpine, which is what
          # actually builds the bundle. Note client/.nvmrc still says 18.
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run tests
        working-directory: client
        run: npm test

      - name: Build
        working-directory: client
        # Vite inlines import.meta.env at build time, so this is a build
        # input rather than runtime config — the same reason
        # docker-compose.yml passes it as a build arg.
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_TG_BOT_USERNAME: ci_test_bot
        run: npm run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, admin, bot, client]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds the image without pushing it. The test jobs install from
      # requirements.txt, so they already catch a broken dependency — this
      # catches a broken Dockerfile, which nothing else does.
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # Only client/Dockerfile declares this one; passing it to the
          # others would just log "build-args were not consumed".
          build-args: ${{ matrix.service == 'client' && 'VITE_API_BASE_URL=http://localhost:8000' || '' }}

  ci-pass:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [python, client, docker]
    # Runs even when a dependency failed, so the gate reports a real
    # verdict instead of being skipped — a skipped required check never
    # resolves, and the PR sits there waiting forever.
    if: always()
    steps:
      - name: Check that every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All jobs passed."
