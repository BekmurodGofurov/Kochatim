services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kochatim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kochatim_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-kochatim}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kochatim} -d ${POSTGRES_DB:-kochatim}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [kochatim]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ./admin/.env
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [kochatim]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Loopback only. The host's nginx terminates TLS for
    # api.kochatim.uz and proxies here — see deploy/nginx/.
    # Never widen this to "8000:8000": that would expose the API over
    # plain HTTP, bypassing nginx entirely.
    ports:
      - "127.0.0.1:8000:8000"
    networks: [kochatim]

  admin:
    build: ./admin
    restart: unless-stopped
    env_file:
      - ./admin/.env
    depends_on:
      redis:
        condition: service_healthy
    # The panel has NO authentication (docs/security.md, issue 2), so it
    # must never be published. Reach it with an SSH tunnel:
    #   ssh -L 9000:127.0.0.1:9000 admin@<server>
    ports:
      - "127.0.0.1:9000:9000"
    networks: [kochatim]

  bot:
    build: ./bot
    restart: unless-stopped
    env_file:
      - ./bot/.env
    depends_on:
      - backend
    networks: [kochatim]

  # Only for running the whole stack locally. In production the frontend
  # is built and served by Cloudflare Pages, and ports 80/443 belong to
  # the host's nginx, so this container is not started:
  #   docker compose up -d                    # server
  #   docker compose --profile local up -d    # local, client on :8080
  client:
    profiles: ["local"]
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: ${PUBLIC_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "8080:80"
    networks: [kochatim]


volumes:
  pgdata:
  redisdata:

networks:
  kochatim:
    driver: bridge
